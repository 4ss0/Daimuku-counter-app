<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0c0d0f" />
    <meta name="color-scheme" content="dark light" />
    <title>Daimoku</title>
    <script>
      // paint the saved theme before the app loads (avoids a dark/light flash)
      try {
        var c = JSON.parse(localStorage.getItem('daimoku-theme') || '{}');
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var th = c.theme === 'light' || c.theme === 'dark' ? c.theme : dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = th;
        document.documentElement.dataset.accent = c.accent || 'lotus';
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
