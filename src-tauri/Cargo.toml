[package]
name = "daimuku-counter"
version = "0.2.0"
description = "Daimoku counter application"
authors = ["you"]
edition = "2021"

[lib]
name = "daimuku_counter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
hound = "3"
base64 = "0.22"
dirs = "5"

[profile.dev.package.daimuku-counter]
opt-level = 3
